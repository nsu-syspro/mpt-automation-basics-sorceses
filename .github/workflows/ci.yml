name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Build application
      run: make
      
    - name: Run tests
      run: make check
      
    - name: Test version output
      run: |
        ./build/wordcount --version
        echo "hello world" | ./build/wordcount
